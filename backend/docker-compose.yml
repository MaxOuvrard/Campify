services:
  # Base vérifiée (ADR 0013) : PostgreSQL + extension TimescaleDB. Les
  # tables relationnelles (Room, Device, User, Command) y vivent comme
  # avant ; `Measurement` y est une hypertable. `shared_preload_libraries`
  # est passé explicitement : l'image ne le configure qu'à l'initialisation
  # d'un volume vide, pas sur un volume PostgreSQL existant.
  postgres:
    image: timescale/timescaledb:latest-pg16
    command: ['postgres', '-c', 'shared_preload_libraries=timescaledb']
    environment:
      POSTGRES_USER: campify
      POSTGRES_PASSWORD: campify
      POSTGRES_DB: campify
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Journal brut (ADR 0013) : un document par message MQTT reçu, tel quel,
  # avant tout parsing/dédup. Port lié à localhost seulement : pas
  # d'authentification sur cette instance locale de démo.
  mongo:
    image: mongo:7
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - '1883:1883'
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto.acl:/mosquitto/config/mosquitto.acl
      - ./mosquitto.passwd:/mosquitto/config/mosquitto.passwd

  # Process API (ADR 0012) : ne lit jamais que la base vérifiée. Le client
  # MQTT qu'il garde ne sert qu'à publier des commandes (POST
  # /devices/:id/commands) — plus aucun abonnement ici, donc pas de
  # MONGO_URL à lui donner.
  backend:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://campify:campify@postgres:5432/campify?schema=public
      # `localhost` dans .env vise l'hôte (usage `npm run dev` hors
      # conteneur) — depuis le conteneur backend, `localhost` se désigne
      # lui-même, pas mosquitto. Comme pour DATABASE_URL ci-dessus, on
      # pointe vers le nom de service Docker. Mot de passe = celui généré
      # en local pour l'utilisateur "backend" (README, section Démarrage).
      MQTT_URL: mqtt://backend:changeme-local-only@mosquitto:1883
      # JSON forcé quel que soit NODE_ENV : c'est ce que Promtail/Loki
      # savent parser — voir shared/logger.ts et observability/.
      LOG_FORMAT: json
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - mosquitto

  # Ingester (ADR 0012) : seul abonné MQTT (mesures + accusés), écrit en
  # journal MongoDB uniquement — jamais de mesure vérifiée. Session
  # persistante (clientId dérivé du hostname du conteneur, voir
  # composition.ts), donc rattrape ce qui a été publié pendant une coupure
  # (ADR 0010). MQTT_SHARED_GROUP défini ici (contrairement à `.env`) pour
  # pouvoir scaler : `docker compose up -d --scale ingester=3` répartit
  # alors les messages entre les 3 instances au lieu de les tripler.
  ingester:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://campify:campify@postgres:5432/campify?schema=public
      MONGO_URL: mongodb://mongo:27017/campify_raw
      MQTT_URL: mqtt://backend:changeme-local-only@mosquitto:1883
      MQTT_SHARED_GROUP: campify-ingesters
      LOG_FORMAT: json
    command: ['node', 'dist/ingester.js']
    depends_on:
      - postgres
      - mongo
      - mosquitto
      - backend

  # Worker de consolidation (ADR 0011) : process à part, qui ne touche
  # jamais à MQTT ni à l'API — un pic d'ingestion MQTT ne peut donc plus
  # ralentir les réponses de l'API, puisqu'elles ne tournent plus dans le
  # même process. Relit le journal MongoDB depuis son curseur toutes les
  # CONSOLIDATION_POLL_INTERVAL_MS (3s par défaut) et écrit en base vérifiée
  # (TimescaleDB) ce qui passe plausibilité/dédup. UNE seule instance (ordre). `depends_on: backend`
  # uniquement pour s'assurer que les migrations (lancées par `backend` au
  # démarrage) sont déjà appliquées — le worker ne les relance pas lui-même.
  worker:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://campify:campify@postgres:5432/campify?schema=public
      MONGO_URL: mongodb://mongo:27017/campify_raw
      LOG_FORMAT: json
    command: ['node', 'dist/worker.js']
    depends_on:
      - postgres
      - mongo
      - backend

  # Stack de centralisation/visualisation des logs (scénario J3). Un seul
  # `docker compose up -d` la démarre avec le reste — voir
  # docs/decisions/0009-stack-logs-centralises.md et
  # backend/observability/README.md.
  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    ports:
      - '3100:3100'

  promtail:
    image: grafana/promtail:3.0.0
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      # Auth désactivée : stack locale/démo, jamais exposée publiquement —
      # objectif ici est qu'une personne extérieure au groupe puisse
      # reproduire les observations sans étape de connexion.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards/json
    ports:
      - '3001:3000'
    depends_on:
      - loki

volumes:
  postgres-data:
  mongo-data:
  loki-data:
