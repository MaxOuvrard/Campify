listener 1883
allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd
acl_file /mosquitto/config/mosquitto.acl

# Une session persistante non reprise depuis 1h est supprimée : filet de
# sécurité si un clientId d'ingester change malgré tout (une session orpheline
# reste sinon membre de la souscription partagée et reçoit sa part des
# messages, perdus — voir docs/J5.md).
persistent_client_expiration 1h
