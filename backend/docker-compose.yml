services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campify
      POSTGRES_PASSWORD: campify
      POSTGRES_DB: campify
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Base brute (landing zone) pour les mesures : reçoit tout, sans filtre,
  # avant que le domaine ne décide quoi retenir dans postgres/campify. Voir
  # ADR 0005.
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: campify
      POSTGRES_PASSWORD: campify
      POSTGRES_DB: campify_raw
    ports:
      - '5433:5432'
    volumes:
      - timescale-data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - '1883:1883'
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto.acl:/mosquitto/config/mosquitto.acl
      - ./mosquitto.passwd:/mosquitto/config/mosquitto.passwd

  backend:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://campify:campify@postgres:5432/campify?schema=public
      RAW_MEASUREMENTS_DATABASE_URL: postgresql://campify:campify@timescaledb:5432/campify_raw?schema=public
      # `localhost` dans .env vise l'hôte (usage `npm run dev` hors
      # conteneur) — depuis le conteneur backend, `localhost` se désigne
      # lui-même, pas mosquitto. Comme pour DATABASE_URL ci-dessus, on
      # pointe vers le nom de service Docker. Mot de passe = celui généré
      # en local pour l'utilisateur "backend" (README, section Démarrage).
      MQTT_URL: mqtt://backend:changeme-local-only@mosquitto:1883
      # JSON forcé quel que soit NODE_ENV : c'est ce que Promtail/Loki
      # savent parser — voir shared/logger.ts et observability/.
      LOG_FORMAT: json
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - timescaledb
      - mosquitto

  # Stack de centralisation/visualisation des logs (scénario J3). Un seul
  # `docker compose up -d` la démarre avec le reste — voir
  # docs/decisions/0009-stack-logs-centralises.md et
  # backend/observability/README.md.
  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    ports:
      - '3100:3100'

  promtail:
    image: grafana/promtail:3.0.0
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      # Auth désactivée : stack locale/démo, jamais exposée publiquement —
      # objectif ici est qu'une personne extérieure au groupe puisse
      # reproduire les observations sans étape de connexion.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards/json
    ports:
      - '3001:3000'
    depends_on:
      - loki

volumes:
  postgres-data:
  timescale-data:
  loki-data:
